name: Claude PR Review

# Second-reviewer bot: only ever engages with PRs opened by the repo owner.
# PRs from anyone else are left untouched — the owner remains the sole human
# gate on external contributions.

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.user.login == 'marcintk'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@9cdae7f0d995e3ba7c33f226087fdf82a59cd520 # v1.0.223
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Use the Task tool to delegate to the project's `pr-reviewer` subagent
            (.claude/agents/pr-reviewer.md) to review pull request
            #${{ github.event.pull_request.number }} in ${{ github.repository }}.
          claude_args: |
            --allowedTools "Task,Read,Grep,Glob,Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*)"
