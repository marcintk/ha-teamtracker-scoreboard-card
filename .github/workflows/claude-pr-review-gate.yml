name: Claude PR Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  review:
    # Never run with repo secrets against a fork's untrusted head branch.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@28f83620103c48a57093dcc2837eec89e036bb9f # beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: "claude-sonnet-4-5"
          allowed_tools: "Bash,Read,Grep,Glob"
          custom_instructions: |
            You are an independent, read-only reviewer gating pull request
            #${{ github.event.pull_request.number }} before it can merge. Never edit
            files, never push commits — your only output is a submitted GitHub review.

            1. Run `gh pr diff ${{ github.event.pull_request.number }}` to see the
               changes.
            2. Review for correctness bugs, security issues, and violations of this
               repo's CLAUDE.md design invariants — not style nits.
            3. If useful to confirm a suspicion, run `npm run typecheck`, `npm test`,
               or `npm run check` (read-only checks, make no fixes yourself).
            4. Submit exactly one verdict as a real GitHub review — never leave the PR
               unreviewed:
               - No blocking issues:
                 `gh pr review ${{ github.event.pull_request.number }} --approve --body "<one-paragraph summary of what you checked>"`
               - Blocking issues found:
                 `gh pr review ${{ github.event.pull_request.number }} --request-changes --body "<the specific findings>"`
